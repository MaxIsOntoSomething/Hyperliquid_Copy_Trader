# ─── Nginx config for Hyperliquid Dashboard (Telegram Mini App) ───────────────
#
# Replace "trading.example.com" with your real domain everywhere below.
# Run: certbot --nginx -d trading.example.com
# Then restart nginx: sudo systemctl restart nginx
#
# ──────────────────────────────────────────────────────────────────────────────

server {
    listen 80;
    server_name trading.example.com;

    # Redirect all HTTP → HTTPS (required by Telegram Mini App)
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name trading.example.com;

    # SSL — filled in by certbot automatically
    ssl_certificate     /etc/letsencrypt/live/trading.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/trading.example.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # Security headers
    add_header X-Frame-Options           SAMEORIGIN;
    add_header X-Content-Type-Options    nosniff;
    add_header Referrer-Policy           strict-origin-when-cross-origin;
    add_header Content-Security-Policy   "default-src 'self' https://telegram.org; script-src 'self' https://telegram.org 'unsafe-inline'; style-src 'self' 'unsafe-inline';";

    # Proxy to FastAPI (running in Docker on port 8080)
    location / {
        proxy_pass         http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_read_timeout 60s;
    }
}
