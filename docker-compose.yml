version: '3.8'

services:
  copy-trader:
    build: .
    container_name: hyperliquid-copy-trader
    restart: unless-stopped
    ports:
      - "8080:8080"   # WebApp — proxied by Nginx on the VPS
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./.env:/app/.env
    environment:
      - TZ=UTC
